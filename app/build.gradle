plugins {
    id 'com.android.application'
}

android {
    namespace 'com.raj.ghostscrub'
    compileSdk 34

    defaultConfig {
        applicationId "com.raj.ghostscrub"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}